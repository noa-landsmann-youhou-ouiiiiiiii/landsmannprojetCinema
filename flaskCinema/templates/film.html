{% extends 'base.html' %}
{% block body %}
    <body>
    <div class="container">
    <center>
        <h1>{{ film.titre }}</h1>
    </center>
        <br>
        <div class="row">
            <div class="col-9">
                <h2>Résumé</h2>
                <br>
                {{ film.resume }}
                <br>
            </div>
            <div class="col-3">
                <img src="{{ url_for('static', filename='images/' ~ film.image) }}" class="img-fluid">
                {% if film.interdiction_moins_de_16_ans %}
                    <img src="/static/images/interdiction-moins-de-16-ans.png" class="img-fluid img-smile">
                {% endif %}
            </div>
        </div>
    <br>

        <div class="row">
            <a href="{{url_for('seances')}}" class="btn btn-primary">Voir toutes les séances</a>
        </div>
    </div>
    </body>
{% endblock %}
